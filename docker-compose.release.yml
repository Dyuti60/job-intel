name: aji-public-release

services:
  edge:
    image: caddy:2.10.2-alpine@sha256:4c6e91c6ed0e2fa03efd5b44747b625fec79bc9cd06ac5235a779726618e530d
    container_name: aji-public-edge
    environment:
      AJI_PUBLIC_HOSTNAME: ${AJI_PUBLIC_HOSTNAME:?Set the managed public hostname}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
      - ${AJI_PUBLIC_LOG_ROOT:?Set an external log root}:/var/log/caddy
    networks:
      - edge
      - backend
    read_only: true
    tmpfs:
      - /tmp:size=32m,noexec,nosuid
      - /config/caddy:size=8m
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
    restart: unless-stopped

  public-web:
    image: ${AJI_PUBLIC_IMAGE:?Set an immutable GHCR image}
    container_name: aji-public-web
    pull_policy: always
    environment:
      AJI_APP_ENV: production
      AJI_DEBUG: "false"
      AJI_DATABASE_URL: ${AJI_DATABASE_URL:?Set the read-only public database URL}
      AJI_PUBLIC_ALLOWED_HOSTS: ${AJI_PUBLIC_HOSTNAME}
      AJI_PUBLIC_FORWARDED_ALLOW_IPS: ${AJI_PUBLIC_FORWARDED_ALLOW_IPS:-172.16.0.0/12}
      AJI_PUBLIC_RATE_LIMIT_REQUESTS: ${AJI_PUBLIC_RATE_LIMIT_REQUESTS:-120}
      AJI_PUBLIC_RATE_LIMIT_WINDOW_SECONDS: ${AJI_PUBLIC_RATE_LIMIT_WINDOW_SECONDS:-60}
      AJI_PUBLIC_CACHE_MAX_AGE_SECONDS: ${AJI_PUBLIC_CACHE_MAX_AGE_SECONDS:-60}
      AJI_PUBLIC_MAX_REQUEST_TARGET_BYTES: ${AJI_PUBLIC_MAX_REQUEST_TARGET_BYTES:-4096}
    expose:
      - "8000"
    networks:
      - backend
    read_only: true
    tmpfs:
      - /tmp:size=32m,noexec,nosuid
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    healthcheck:
      test:
        - CMD
        - .venv/bin/python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/readyz', timeout=3)"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    restart: unless-stopped

networks:
  edge:
  backend:
    internal: true

volumes:
  caddy_data:
  caddy_config:
