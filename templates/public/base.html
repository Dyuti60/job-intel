<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{ title }} · Assam Job Intelligence</title>
  <meta name="description" content="{{ description|default('Approved Assam Government recruitment information.') }}">
  {% if canonical_url %}<link rel="canonical" href="{{ canonical_url }}">{% endif %}
  <link rel="icon" href="/static/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/static/public.css">
</head>
<body>
  <a class="skip-link" href="#main-content">Skip to content</a>
  <header class="public-header">
    <div class="shell header-inner">
      <a class="brand" href="/jobs" aria-label="Assam Job Intelligence home">
        <span class="brand-mark" aria-hidden="true">AJ</span>
        <span>Assam Job Intelligence</span>
      </a>
      <span class="trust-label">Approved recruitment data</span>
    </div>
  </header>
  <main id="main-content" class="shell">
    {% block content %}{% endblock %}
  </main>
  <footer class="public-footer">
    <div class="shell">Information is published only after verification and required Human Review. Always follow the linked official source.</div>
  </footer>
</body>
</html>
