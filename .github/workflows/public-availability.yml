name: Public Availability

on:
  workflow_dispatch:
  schedule:
    - cron: "*/30 * * * *"

permissions:
  contents: read

concurrency:
  group: assam-job-intelligence-public-availability
  cancel-in-progress: true

jobs:
  probe:
    name: Probe bounded public surface
    if: ${{ vars.PUBLIC_BASE_URL != '' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check public availability and isolation
        env:
          BASE_URL: ${{ vars.PUBLIC_BASE_URL }}
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --max-time 10 "${BASE_URL%/}/healthz" >/dev/null
          curl --fail --silent --show-error --max-time 10 "${BASE_URL%/}/readyz" >/dev/null
          curl --fail --silent --show-error --max-time 15 "${BASE_URL%/}/jobs" >/dev/null
          for path in /review /operations /api/v1/health /docs /openapi.json; do
            code=$(curl --silent --output /dev/null --write-out '%{http_code}' --max-time 10 "${BASE_URL%/}${path}")
            test "$code" = "404"
          done
