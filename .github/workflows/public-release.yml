name: Public Release

on:
  workflow_dispatch:
    inputs:
      deploy:
        description: Deploy the scanned immutable image to the protected public environment
        required: true
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: assam-job-intelligence-public-production
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ghcr.io/dyuti60/job-intel-public

jobs:
  build:
    name: Build, scan, attest, and promote image
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
      attestations: write
      artifact-metadata: write
      id-token: write
    outputs:
      image: ${{ steps.image.outputs.image }}
      digest: ${{ steps.push.outputs.digest }}
    steps:
      - name: Require main for deployment
        if: ${{ inputs.deploy && github.ref != 'refs/heads/main' }}
        shell: bash
        run: |
          echo "Production deployment is permitted only from refs/heads/main." >&2
          exit 1

      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Resolve immutable image reference
        id: image
        shell: bash
        run: echo "image=${IMAGE_NAME}:sha-${GITHUB_SHA}" >> "$GITHUB_OUTPUT"

      - name: Build image for scanning
        id: build
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          load: true
          push: false
          tags: ${{ steps.image.outputs.image }}
          labels: |
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Scan image for HIGH and CRITICAL vulnerabilities
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ steps.image.outputs.image }}
          format: table
          exit-code: "1"
          ignore-unfixed: true
          severity: HIGH,CRITICAL

      - name: Push scanned immutable image
        id: push
        shell: bash
        run: |
          docker push "${{ steps.image.outputs.image }}"
          reference=$(docker image inspect "${{ steps.image.outputs.image }}" --format '{{index .RepoDigests 0}}')
          digest="${reference#*@}"
          test "${digest#sha256:}" != "$digest"
          echo "digest=$digest" >> "$GITHUB_OUTPUT"

      - name: Generate image provenance attestation
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-name: ${{ env.IMAGE_NAME }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true

      - name: Publish build summary
        shell: bash
        run: |
          {
            echo "## Public release artifact"
            echo ""
            echo "- Image: \`${{ steps.image.outputs.image }}\`"
            echo "- Digest: \`${{ steps.push.outputs.digest }}\`"
            echo "- Vulnerability policy: no fixable HIGH/CRITICAL findings"
            echo "- Provenance: GitHub artifact attestation published"
          } >> "$GITHUB_STEP_SUMMARY"

  deploy:
    name: Deploy protected public environment
    if: ${{ inputs.deploy }}
    needs: build
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 20
    environment:
      name: public-production
      url: ${{ vars.PUBLIC_BASE_URL }}
    permissions:
      contents: read
      packages: read
    env:
      AJI_APP_ENV: production
      AJI_DATABASE_URL_SECRET: ${{ secrets.AJI_PUBLIC_DATABASE_URL }}
      AJI_BACKUP_DATABASE_URL: ${{ secrets.AJI_BACKUP_DATABASE_URL }}
      AJI_PUBLIC_HOSTNAME: ${{ vars.PUBLIC_HOSTNAME }}
      AJI_PUBLIC_BASE_URL: ${{ vars.PUBLIC_BASE_URL }}
      AJI_PUBLIC_LOG_ROOT: D:\ASSAM_JOB_DATA\public-release\logs
      AJI_PUBLIC_RELEASE_AUDIT: D:\ASSAM_JOB_DATA\public-release\releases.jsonl
      AJI_BACKUP_ROOT: D:\ASSAM_JOB_DATA\backups
      AJI_RAW_STORAGE_ROOT: D:\ASSAM_JOB_DATA\raw
      AJI_PUBLIC_FORWARDED_ALLOW_IPS: 172.16.0.0/12
      PSExecutionPolicyPreference: Bypass
    steps:
      - name: Check out exact release commit
        uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1

      - name: Install Python and synchronize release tools
        shell: powershell
        run: |
          uv python install 3.12
          uv sync --frozen --python 3.12

      - name: Resolve protected deployment configuration
        shell: powershell
        run: |
          if ([string]::IsNullOrWhiteSpace($env:AJI_DATABASE_URL_SECRET)) {
            throw "The protected AJI_PUBLIC_DATABASE_URL secret is required."
          }
          if ([string]::IsNullOrWhiteSpace($env:AJI_BACKUP_DATABASE_URL)) {
            throw "The protected AJI_BACKUP_DATABASE_URL secret is required."
          }
          if ([string]::IsNullOrWhiteSpace($env:AJI_PUBLIC_HOSTNAME) -or
              [string]::IsNullOrWhiteSpace($env:AJI_PUBLIC_BASE_URL)) {
            throw "PUBLIC_HOSTNAME and PUBLIC_BASE_URL environment variables are required."
          }
          Write-Output "::add-mask::$env:AJI_DATABASE_URL_SECRET"
          Write-Output "::add-mask::$env:AJI_BACKUP_DATABASE_URL"
          "AJI_DATABASE_URL=$env:AJI_DATABASE_URL_SECRET" |
            Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          New-Item -ItemType Directory -Path $env:AJI_PUBLIC_LOG_ROOT -Force | Out-Null

      - name: Create coordinated pre-release backup
        id: backup
        shell: powershell
        run: >-
          .\scripts\create_runtime_backup.ps1
          -BackupRoot $env:AJI_BACKUP_ROOT
          -RawRoot $env:AJI_RAW_STORAGE_ROOT

      - name: Log in to GitHub Container Registry
        shell: powershell
        run: $env:GITHUB_TOKEN | docker login ghcr.io --username $env:GITHUB_ACTOR --password-stdin
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Deploy with health rollback
        id: deploy
        shell: powershell
        run: |
          .\scripts\deploy_public_release.ps1 `
            -Image '${{ env.IMAGE_NAME }}@${{ needs.build.outputs.digest }}' `
            -BaseUrl $env:AJI_PUBLIC_BASE_URL `
            -AuditFile $env:AJI_PUBLIC_RELEASE_AUDIT

      - name: Publish deployment summary
        if: always()
        shell: powershell
        run: |
          Add-Content $env:GITHUB_STEP_SUMMARY '## Public production deployment'
          Add-Content $env:GITHUB_STEP_SUMMARY ''
          Add-Content $env:GITHUB_STEP_SUMMARY "- Image: ``${{ needs.build.outputs.image }}``"
          Add-Content $env:GITHUB_STEP_SUMMARY "- Digest: ``${{ needs.build.outputs.digest }}``"
          Add-Content $env:GITHUB_STEP_SUMMARY "- Target: ``$env:AJI_PUBLIC_HOSTNAME``"
          Add-Content $env:GITHUB_STEP_SUMMARY "- Backup manifest: ``${{ steps.backup.outputs.backup_manifest }}``"
          Add-Content $env:GITHUB_STEP_SUMMARY '- Private routes were checked by the release smoke gate.'
