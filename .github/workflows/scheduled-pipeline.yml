name: Trusted Assam Pipeline

on:
  workflow_dispatch:
    inputs:
      selection:
        description: Scheduler selection mode
        required: true
        default: due
        type: choice
        options:
          - due
          - source
          - group
          - all-enabled
      source:
        description: Source used when selection is source
        required: true
        default: APSC
        type: choice
        options:
          - APSC
          - SLPRB_ASSAM
          - DEE_ASSAM
          - DME_ASSAM
          - ASDMA_ASSAM
      group:
        description: Schedule group used when selection is group
        required: true
        default: HIGH_PRIORITY
        type: choice
        options:
          - HIGH_PRIORITY
          - NORMAL
          - LOW_FREQUENCY
          - DISTRICT
      dry_run:
        description: Record operational history but roll back recruitment-domain changes
        required: true
        default: false
        type: boolean
  schedule:
    - cron: "30 2 * * *"

permissions:
  contents: read

concurrency:
  group: assam-job-intelligence-source-scheduler
  cancel-in-progress: false

jobs:
  pipeline:
    name: Run trusted Assam pipeline
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 30
    env:
      AJI_APP_ENV: production
      AJI_DEBUG: "false"
      AJI_LOG_LEVEL: INFO
      AJI_SCHEDULER_SELECTION: ${{ inputs.selection || 'due' }}
      AJI_PIPELINE_SOURCE: ${{ inputs.source || 'APSC' }}
      AJI_PIPELINE_GROUP: ${{ inputs.group || 'HIGH_PRIORITY' }}
      AJI_PIPELINE_DRY_RUN: ${{ inputs.dry_run || false }}
      AJI_RUNTIME_CONFIG_PATH: D:\ASSAM_JOB_DATA\config\runtime.env
      AJI_RAW_STORAGE_ROOT: D:\ASSAM_JOB_DATA\raw
      AJI_DATABASE_URL_SECRET: ${{ secrets.AJI_DATABASE_URL }}
      PSExecutionPolicyPreference: Bypass

    steps:
      - name: Check out trusted main branch
        uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          enable-cache: true

      - name: Install isolated Python 3.12
        shell: powershell
        run: uv python install 3.12

      - name: Synchronize frozen dependencies
        shell: powershell
        run: uv sync --frozen --python 3.12

      - name: Resolve persistent runtime configuration
        shell: powershell
        run: |
          $runtimeLines = @()
          if (Test-Path -LiteralPath $env:AJI_RUNTIME_CONFIG_PATH -PathType Leaf) {
            $runtimeLines = Get-Content -LiteralPath $env:AJI_RUNTIME_CONFIG_PATH
          }
          $databaseUrl = $env:AJI_DATABASE_URL_SECRET
          if ([string]::IsNullOrWhiteSpace($databaseUrl)) {
            if ($runtimeLines.Count -eq 0) {
              throw "AJI_DATABASE_URL secret is unset and external runtime config is missing."
            }
            $entry = $runtimeLines |
              Where-Object { $_ -match '^AJI_DATABASE_URL=' } |
              Select-Object -First 1
            if ($null -eq $entry) {
              throw "External runtime config does not define AJI_DATABASE_URL."
            }
            $databaseUrl = $entry.Substring('AJI_DATABASE_URL='.Length).Trim()
          }
          if ([string]::IsNullOrWhiteSpace($databaseUrl)) {
            throw "AJI_DATABASE_URL resolved to an empty value."
          }
          if ($databaseUrl.Contains("`r") -or $databaseUrl.Contains("`n")) {
            throw "AJI_DATABASE_URL must be a single line."
          }
          Write-Output "::add-mask::$databaseUrl"
          "AJI_DATABASE_URL=$databaseUrl" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

          $optionalSettings = @(
            'AJI_MONITOR_NOTIFICATION_CHANNELS',
            'AJI_MONITOR_NOTIFICATION_FILE'
          )
          foreach ($key in $optionalSettings) {
            $entry = $runtimeLines |
              Where-Object { $_ -match "^$([regex]::Escape($key))=" } |
              Select-Object -First 1
            if ($null -ne $entry) {
              $value = $entry.Substring($key.Length + 1).Trim()
              if ($value.Contains("`r") -or $value.Contains("`n")) {
                throw "$key must be a single line."
              }
              "$key=$value" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
            }
          }

          $rawRoot = [IO.Path]::GetFullPath($env:AJI_RAW_STORAGE_ROOT)
          $workspace = [IO.Path]::GetFullPath($env:GITHUB_WORKSPACE)
          if ($rawRoot.StartsWith($workspace, [StringComparison]::OrdinalIgnoreCase)) {
            throw "AJI_RAW_STORAGE_ROOT must remain outside the Actions checkout."
          }
          New-Item -ItemType Directory -Path $rawRoot -Force | Out-Null

      - name: Upgrade persistent database
        shell: powershell
        run: uv run alembic upgrade head

      - name: Report migration revision
        shell: powershell
        run: uv run alembic current

      - name: Run source scheduler
        id: pipeline
        continue-on-error: true
        shell: powershell
        run: |
          $trigger = if ('${{ github.event_name }}' -eq 'schedule') { 'SCHEDULED' } else { 'GITHUB_ACTION' }
          $arguments = @('run', 'python', '-m', 'workers.scheduler', '--trigger', $trigger)
          switch ($env:AJI_SCHEDULER_SELECTION) {
            'source' { $arguments += @('--source', $env:AJI_PIPELINE_SOURCE) }
            'group' { $arguments += @('--group', $env:AJI_PIPELINE_GROUP) }
            'all-enabled' { $arguments += '--all-enabled' }
            default { $arguments += '--due' }
          }
          if ($env:AJI_PIPELINE_DRY_RUN -eq 'true') {
            $arguments += '--dry-run'
          }
          $outputFile = Join-Path $env:RUNNER_TEMP 'assam-job-intelligence-pipeline.txt'
          "AJI_PIPELINE_OUTPUT_FILE=$outputFile" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          # Windows PowerShell surfaces native stderr (including normal Python logging) as
          # NativeCommandError records. Keep streaming it, then trust the process exit code.
          $ErrorActionPreference = 'Continue'
          & uv @arguments 2>&1 | Tee-Object -FilePath $outputFile
          $pipelineExitCode = $LASTEXITCODE
          "exit_code=$pipelineExitCode" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          exit $pipelineExitCode

      - name: Evaluate per-source operational health and notifications
        id: monitoring
        if: always() && steps.pipeline.outcome != 'skipped'
        shell: powershell
        run: |
          $sources = @('APSC', 'SLPRB_ASSAM', 'DEE_ASSAM', 'DME_ASSAM', 'ASDMA_ASSAM')
          foreach ($source in $sources) {
            uv run python -m workers.monitoring --source $source
            if ($LASTEXITCODE -ne 0) { throw "Monitoring failed for $source" }
          }

      - name: Publish operational summary
        if: always()
        shell: powershell
        run: |
          Add-Content -LiteralPath $env:GITHUB_STEP_SUMMARY -Value '## Assam Job Intelligence pipeline'
          Add-Content -LiteralPath $env:GITHUB_STEP_SUMMARY -Value ''
          Add-Content -LiteralPath $env:GITHUB_STEP_SUMMARY -Value "- Selection: ``$env:AJI_SCHEDULER_SELECTION``"
          Add-Content -LiteralPath $env:GITHUB_STEP_SUMMARY -Value "- Source (when selected): ``$env:AJI_PIPELINE_SOURCE``"
          Add-Content -LiteralPath $env:GITHUB_STEP_SUMMARY -Value "- Event: ``${{ github.event_name }}``"
          Add-Content -LiteralPath $env:GITHUB_STEP_SUMMARY -Value "- Dry run: ``$env:AJI_PIPELINE_DRY_RUN``"
          Add-Content -LiteralPath $env:GITHUB_STEP_SUMMARY -Value '- Human Review remains private at the local `/review` interface.'
          if ($env:AJI_PIPELINE_OUTPUT_FILE -and (Test-Path -LiteralPath $env:AJI_PIPELINE_OUTPUT_FILE)) {
            Add-Content -LiteralPath $env:GITHUB_STEP_SUMMARY -Value ''
            Add-Content -LiteralPath $env:GITHUB_STEP_SUMMARY -Value '```text'
            $pipelineOutput = Get-Content -LiteralPath $env:AJI_PIPELINE_OUTPUT_FILE -Raw
            Add-Content -LiteralPath $env:GITHUB_STEP_SUMMARY -Value $pipelineOutput
            Add-Content -LiteralPath $env:GITHUB_STEP_SUMMARY -Value '```'
          }

      - name: Preserve pipeline failure result
        if: always() && steps.pipeline.outputs.exit_code != '0'
        shell: powershell
        run: throw "Pipeline exited with code ${{ steps.pipeline.outputs.exit_code }}."
